<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة شكر وامتنان - يوم المعلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f4ee;
            background-image: radial-gradient(#e6decb 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #4a4238;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #5c6b73;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #8c7b6c;
            margin-bottom: 25px;
        }

        /* الحاوية الكلية للظرف والبطاقة */
        .envelope-box {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* البطاقة الداخلية */
        .card {
            position: absolute;
            width: 330px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(92, 107, 115, 0.15);
            z-index: 1;
            border: 1px solid #eae2d0;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s;
            pointer-events: none;
        }

        .envelope-box.open .card {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            z-index: 10;
        }

        .card-content {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #3b4248;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .reset-btn {
            background-color: #5c6b73;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background-color: #455259;
        }

        /* الظرف نفسه */
        .envelope-wrapper {
            position: absolute;
            width: 360px;
            height: 240px;
            cursor: pointer;
            transition: transform 0.6s ease, opacity 0.4s ease;
            filter: drop-shadow(0 15px 25px rgba(92, 107, 115, 0.15));
            z-index: 5;
            bottom: 30px;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px);
        }

        .envelope-box.open .envelope-wrapper {
            transform: translateY(130px);
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #b0c4de;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }

        .envelope-top-lace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 34px;
            display: block;
            z-index: 12;
            object-fit: cover;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: #9fb7d4;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 4;
        }

        .envelope-box.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: #b0c4de;
            clip-path: polygon(0 100%, 50% 30%, 100% 100%);
            z-index: 3;
            border-radius: 0 0 12px 12px;
        }

        .lace-trim {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background-image: radial-gradient(circle, #fff 50%, transparent 51%);
            background-repeat: repeat-x;
            z-index: 5;
            opacity: 0.85;
        }

        .lace-trim-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #fff 45%, transparent 46%);
            background-size: 14px 14px;
            background-repeat: repeat-x;
            z-index: 5;
            opacity: 0.8;
        }

        .wax-seal {
            position: absolute;
            right: 50%;
            top: 50%;
            transform: translate(50%, -50%);
            width: 92px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: transparent;
            border: none;
        }

        .wax-seal img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18));
        }

        .seal-text {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #683d2c;
        }

        .envelope-box.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-text {
            position: absolute;
            top: 35px;
            width: 100%;
            text-align: center;
            z-index: 5;
            color: #2c3e50;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .open-hint {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            z-index: 2;
            color: #ffffff;
            font-size: 0.85rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* التوقيع والتذييل في الأسفل */
        .credits {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #7a6b5d;
            line-height: 1.6;
            border-top: 1px dashed #d9ceb8;
            padding-top: 12px;
            width: 100%;
        }
        .credits span {
            display: block;
            font-weight: 600;
            color: #5c6b73;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>يوم المعلم</h1>
        <div class="subtitle">رسالة شكر وامتنان لكل معلمة ملهمة</div>

        <div class="envelope-box" id="envelopeBox">
            <!-- البطاقة الداخلية -->
            <div class="card" id="card">
                <div class="card-content" id="messageContainer">
                    جاري اختيار رسالتك الخاصة...
                </div>
                <button class="reset-btn" onclick="resetEnvelope(event)">إغلاق الظرف</button>
            </div>

            <!-- الظرف -->
            <div class="envelope-wrapper" onclick="openEnvelope()">
                <div class="envelope">
                    <img class="envelope-top-lace" src="assest/d.png" alt="lace trim">
                    <div class="envelope-flap">
                        <div class="lace-trim-flap"></div>
                    </div>
                    <div class="lace-trim" style="top: -2px;"></div>
                    <div class="envelope-pocket"></div>
                    <div class="envelope-text">إلى معلمتي الفاضلة</div>
                    <div class="wax-seal" id="waxSeal">
                        <img id="sealPreview" alt="صورة الختم" hidden>
                        <span class="seal-text" id="sealText">شكر</span>
                    </div>
                    <div class="open-hint">اضغطي هنا لفتح الرسالة</div>
                </div>
            </div>
        </div>

        <!-- تذييل الصفحة بأسماء المبدعات -->
        <div class="credits">
            فكرة: مليكة محمود عزام | تطبيق: مريم فيصل فتر<br>
            <span>الصف: 5فيز2 | فريق التمكين الرقمي</span>
            مدرسة سار الثانوية للبنات
        </div>
    </div>

    <script>
            const messages = [
            /* 1 إلى 15: رسائل عميقة وكلاسيكية */
            "شكراً لأنك تزرعين الأمل كل يوم في قلوب طالباتك، وتصنعين فارقاً لا يُنسى في حياتهن.",
            "إلى المعلمة التي تُحول صُعوبات العلم إلى متعة واكتشاف، جزاكِ الله خيراً عن كل حرفٍ علمتيه.",
            "بصماتك الجميلة في قاعات الدراسة تبقى محفورة في الذاكرة للأبد. شكراً لعطائك اللا محدود.",
            "رسالة حب وامتنان لكل لحظة صبر بذلتها من أجلنا ومن أجل إضاءة عقولنا. يوم معلم سعيد!",
            "أنتِ لستِ مجرد معلمة، بل قنديل يضيء دروب النجاح والتفوق لكل من عرفكِ.",
            "شكراً لقلبكِ الكبير وروحكِ الجميلة التي تتسع دائماً لاحتواء الجميع وتوجيههن نحو الأفضل.",
            "كل كلمات الشكر لا توفيكِ حقكِ من التقدير. دمتِ نبراساً للعلوم والقيم والأخلاق.",
            "لعطائكِ المستمر وأثركِ الطيب الذي لا يزال يثمر نجاحاً، لكِ منا كل الحب والامتنان.",
            "وجودكِ في المدرسة يضفي طاقة إيجابية وإلهاماً حقيقياً لكل الطالبات والزميلات.",
            "شكراً لأنكِ تؤمنين بقوة العلم وتؤدين رسالتكِ بأمانة وإخلاص عظيمين.",
            "بفضلكِ تصبح الصعاب سهلة، والعلوم ممتعة. شكراً لكونكِ معلمة استثنائية بحق.",
            "إلى كل شمعة تحترق لتضيء طريق الآخرين.. شكراً لأنكِ هنا تصنعين مستقبل الأجيال.",
            "عطاؤكِ الفيض وجهدكِ الصادق هما أساس كل تميز وتفوق نراه اليوم. شكراً لكِ.",
            "لكِ منا خالص الشكر والتقدير على تفانيكِ المستمر ورسالتكِ السامية في التعليم.",
            "أنتِ المظلة التي نستظل بها في عواصف الدراسة، شكراً لحنانكِ ودعمكِ الدائم.",

            /* 16 إلى 30: رسائل لطيفة وقريبة للقلب */
            "يا سُكّر المدرسة ونورها، شكراً لأنكِ تخلين الحصة تخلص بسرعة من كثر ما هي ممتعة! يوم معلم سعيد يا أجمل أستاذة.",
            "مو غريبة عليكِ الطيبة والإبداع، شكراً لأنكِ مو بس معلمة.. أخت وصديقة وقدوة لكل طالبة محظوظة في فصلكِ.",
            "الله يديمكِ لنا نبع طاقة إيجابية وضحكة منورة الفصل كل يوم! شكراً لكِ على كل شيء.",
            "تدخلين الفصل فتفتحين مع الشباك بوابات الأمل والتفاؤل، شكراً لأنكِ ألطف معلمة عرفناها.",
            "وجودكِ يخلي المدرسة مكان أحلى وأهون، شكراً لأنكِ دائماً تسمعينا وتفهمينا بكل حب.",
            "إلى المعلمة اللي قلبها أبيض مثل غيم الصباح، شكراً لجمال روحكِ وعطائكِ المستمر.",
            "لو فيه جائزة لألطف وأفخم أستاذة بالدنيا، كان فزتي فيها وبكل جدارة! شكراً لأنكِ معنا.",
            "شكراً لأنكِ دائماً تبتسمين في وجوهنا وتصنعين لنا يوماً جميلاً حتى في أصعب الأوقات.",
            "وجود معلمة زيك يخلي الواحد يحب المدرسة ويدخلها وهو متحمس، شكراً لكونكِ مصدر سعادتنا اليومي!",
            "حتى في أيام التعب والضغط، ابتسامتكِ وشرحكِ اللطيف ينسينا كل شي.. شكراً لقلبكِ الدافئ.",
            "شكراً لأنكِ ما كنتِ مجرد معلمة تشرح الدرس، بل كنتِ أماً ثانية وأختاً حنونة تخاف علينا وتوجهنا.",
            "إلى الأستاذة التي تملك مفتاح القلوب قبل عقول الطالبات، دمتِ لنا رمزاً للحب والعطاء.",
            "الله يكتب لكِ الأجر عن كل كلمة طيبة، وكل نصيحة رفعت من معنوياتنا.. محظوظين فيكِ واجد!",
            "مهما قلنا من كلمات، ما نوفيكِ حقكِ من الشكر يا من صنعتِ من العاديين متميزين.",
            "شكراً لأنكِ تتقبيلين حوستنا وأسئلتنا الكثيرة بصدر رحب وضحكة ما تفارق وجهكِ الجميل.",

            /* 31 إلى 50: رسائل إضافية متميزة */
            "إلى من تزرع الورد في طريقنا وتجعل لكل درس طعم تاني.. شكراً لأنكِ معلمتنا الرائعة.",
            "أستاذتنا الغالية، وجودكِ بالحصة يخلي الواحد غصب يحب المادة وينتبه معكِ.. شكراً لروعتكِ!",
            "شكراً لأنكِ دائماً تلاحظين جهودنا وتشجعينا بكلمة حلوة ترفع الروح المعنوية، الله يحفظكِ.",
            "إلى المعلمة اللي طبعها يجنن وأسلوبها يفتح النفس.. شكراً لأنكِ جزء جميل من رحلتنا الدراسية.",
            "مو مجرد أستاذة نخلص معها المنهج، إنتِ إنسانة تترك أثر جميل بقلوبنا للأبد.",
            "الله يعطيكِ ألف عافية على تعبكِ معنا وصبركِ الطويل، نورتي حياتنا المدرسية كلها!",
            "شكراً لأنكِ تخلين الحصة كأنها جلسة لطيفة مليانة فائدة وضحك، ربي يديم عليكِ الصحة والسعادة.",
            "يا بختنا بأستاذة مثلِك، تفهمنا بالنظرة وتدعمنا بكل قلبها.. شكراً لكونكِ سنداً لنا في كل وقت.",
            "ضحكتكِ وحدها بالصباح تفتح النفس وتخلي اليوم الدراسي أجمل بكثير، دمتِ لنا مصدراً للبهجة.",
            "شكراً لأنكِ ما تبخلين علينا بأي معلومة، ودائماً تبحثين عن أسهل وأمتع الطرق عشان نفهم الدرس.",
            "إلى النور الذي يضيء لنا عتمة الصعاب الدراسية، جزاكِ الله عنا كل خير وجعلكِ دائماً سعيدة.",
            "مهما مر الوقت وخلصت أيام المدرسة، بتبقى أفضالكِ وأسلوبكِ الراقي محفورين في ذاكرتنا للابد.",
            "شكراً لصبركِ الجميل معنا، ولأنكِ دائماً تؤمنين بأننا نقدر نوصل لأعلى المراتب.",
            "كل التقدير لعينيكِ الساهرتين على تجهيز الدروس وتسهيل العلم لنا، أنتِ أستاذة لا تعوض.",
            "وجودكِ في قاعتنا هو سر تفوقنا وراحتنا النفسية، شكراً لكونكِ الأفضل دائماً.",
            "من قلوبنا نشكركِ على كل جهد بذلتيه من أجلنا، وجعلتي العلم رحلة ممتعة لا توصف.",
            "إلى من علمنا أن نكبر بالعلم والأخلاق.. شكراً لأنكِ قدوتنا الأولى والأعلي.",
            "تعبكِ معنا ما راح يضيع، وبصمتكِ باقية في كل نجاح نحققه بحياتنا.",
            "شكراً لأنكِ تمنحينا الثقة بأننا قادرين على تخطي أي عقبة مهما كانت.",
            "أنتِ لستِ معلمة فحسب، بل صانعة أجيال وبانية عقول، فلكِ منا كل التبجيل.",

            /* 51 إلى 75: رسائل إضافية راقية */

            "إلى المعلمة التي لا تكتفي بإنهاء المنهج بل تهتم بأن يصل المعنى إلى قلوبنا قبل عقولنا.",

            "شكراً لأنكِ تؤمنين بطاقتنا الكامنة وتخرجين أفضل ما فينا دائماً.",

            "إلى الأستاذة التي لا تفقد صبرها أبدًا، شكراً لقلبكِ الواسع وحكمتكِ العميقة.",
            "كل تحية إجلال لجهودكِ الخفية والظاهرة في بناء مستقبلنا الباهر.",
            "شكراً لأنكِ جعلتي من مادتكِ المدرسية شيئاً نتطلع إليه بشغف كل يوم.",
            "وجودكِ الدائم بجانبنا يمنحنا شعوراً بالأمان والقدرة على مواجهة أي تحدٍ دراسي.",
            "إلى الشمعة المضيئة في حياتنا المدرسية، دمتِ لنا رمزاً للعطاء الذي لا ينضب.",
            "شكراً لأنكِ تزرعين فينا حب التعلم والشغف لاكتشاف العالم من حولنا.",
            "مهما تحدثنا عن فضلكِ فلن نوفيكِ حقكِ، لكِ منا خالص الدعوات بالتوفيق والسعادة.",
            "أنتِ لستِ أستاذة عادية، أنتِ ملهمة حقيقية غيرت نظرتنا للتعليم بالكامل.",
            "شكراً لأنكِ دائماً تقفين معنا وتشجعينا حتى في أوقاتنا الصعبة.",
            "إلى من تعلمنا منها أن النجاح ليس مستحيلاً، شكراً لتفانيكِ المنقطع النظير.",
            "دمتِ لنا سنداً ومعلمة وأختاً كبرى نلجأ إليها في كل استفسار وحيرة.",
            "شكراً لكِ على كل دقيقة قضيتها في سبيل تعليمنا وتوجيهنا للطريق الصحيح.",
            "بكِ تفتخر المدارس وبأمثالكِ ترتقي الأمم، شكراً لكونكِ معلمتنا الغالية.",
            "إلى من تملك أسلوباً ساحراً يجعل أصعب الدروس تبدو سهلة وجميلة.",
            "شكراً لأنكِ تجعليننا نشعر بأهميتنا وقيمتنا داخل الفصل الدراسي وخارجه.",
            "كل مفردات الشكر تقف عاجزة أمام عظم عطائكِ وجميل صنيعكِ معنا.",
            "أستاذتنا الرائعة، دمتِ مصدراً للخير والجمال في كل أيامنا الدراسية.",
            "شكراً لأنكِ تمنحين مهنة التدريس حقها الكامل من الإخلاص والمحبة.",

            /* 76 إلى 105: رسائل إضافية لطيفة ومبدعة */
            "يا أجمل من درّسنا وألطف من التقينا به، يوم معلم سعيد يا غالية!",

        const sealPreview = document.getElementById('sealPreview');

        sealPreview.src = 'assest/wax-removebg-preview.png';

        sealText.hidden = true;

        function openEnvelope() {
            const box = document.getElementById('envelopeBox');
            if (!box.classList.contains('open')) {
                const randomIndex = Math.floor(Math.random() * messages.length);
                document.getElementById('messageContainer').innerText = messages[randomIndex];
                box.classList.add('open');
            }
        }

        function resetEnvelope(event) {
            event.stopPropagation();
            const box = document.getElementById('envelopeBox');
            box.classList.remove('open');
